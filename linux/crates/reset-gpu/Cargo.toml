[package]
name = "reset-gpu"
version = "0.1.0"
edition = "2021"
description = "Benchmarks e stress de GPU do RESET EXPLODE para Linux (janela própria, Vulkan)"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
libc = "0.2"
raw-window-handle = "0.6"
reset-core = { path = "../reset-core" }
serde_json = "1"
winit = "0.30"
