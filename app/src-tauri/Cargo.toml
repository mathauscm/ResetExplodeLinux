[package]
name = "reset-explode"
version = "0.1.0"
edition = "2021"
description = "RESET EXPLODE para Linux"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
reset-core = { path = "../../crates/reset-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
